<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AulaOnline — Pendiente de aprobación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/app.css"/>
</head>
<body>

<div class="topbar">
  <div class="brand">Aula<em>Online</em></div>
</div>

<div class="pending-screen">
  <div class="pending-icon">
    <i class="bi bi-hourglass-split"></i>
  </div>
  <h2 class="pending-title">Cuenta pendiente de aprobación</h2>
  <p class="pending-subtitle">
    Tu solicitud de acceso ha sido enviada. El profesor revisará tu cuenta y te dará acceso en breve.
  </p>
  <div class="alert alert-info pending-alert">
    <i class="bi bi-info-circle"></i>
    Cuando tu acceso sea aprobado, podrás iniciar sesión normalmente. Vuelve a intentarlo en unos minutos.
  </div>
  <div class="pending-actions">
    <button class="btn btn-secondary" id="btn-check">
      <i class="bi bi-arrow-clockwise"></i> Comprobar estado
    </button>
    <button class="btn btn-ghost" id="btn-logout">
      <i class="bi bi-box-arrow-left"></i> Cerrar sesión
    </button>
  </div>
</div>

<div id="toast-container"></div>

<script type="module" src="assets/js/auth/pending.js"></script>
</body>
</html>
